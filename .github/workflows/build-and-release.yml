name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        type: boolean
        default: false
      release_tag:
        description: 'Tag / Title for release (used if manually triggered)'
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            osName: windows
            artifactPath: CardWars-Windows.zip
          - targetPlatform: StandaloneOSX
            osName: macos
            artifactPath: CardWars-macOS.zip
          - targetPlatform: StandaloneLinux64
            osName: linux
            artifactPath: linux-builds/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}

      - name: Package Windows Build
        if: matrix.targetPlatform == 'StandaloneWindows64'
        run: |
          cd build/StandaloneWindows64
          zip -r ../../CardWars-Windows.zip .
          cd ../..

      - name: Package macOS Build
        if: matrix.targetPlatform == 'StandaloneOSX'
        run: |
          cd build/StandaloneOSX
          zip -r ../../CardWars-macOS.zip .
          cd ../..

      - name: Package Linux Build (AppImage + Tarball)
        if: matrix.targetPlatform == 'StandaloneLinux64'
        run: |
          mkdir -p linux-builds
          chmod +x ./scripts/package-appimage.sh
          ./scripts/package-appimage.sh build/StandaloneLinux64 linux-builds/CardWars-x86_64.AppImage
          
          cd build/StandaloneLinux64
          tar -czvf ../../linux-builds/CardWars-Linux.tar.gz .
          cd ../..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.osName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Card Wars ${{ steps.release_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/CardWars-x86_64.AppImage
            release-assets/CardWars-Linux.tar.gz
            release-assets/CardWars-Windows.zip
            release-assets/CardWars-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
