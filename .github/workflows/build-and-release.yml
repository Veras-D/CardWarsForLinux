name: Build and Release (Godot 4)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        type: boolean
        default: false
      release_tag:
        description: 'Tag / Title for release (used if manually triggered)'
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  export_game:
    name: Export Godot 4 Projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Export Godot Project
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./godot
          archive_output: false
          cache: true

      - name: Package Linux (AppImage & Tarball)
        run: |
          mkdir -p release-assets
          BUILD_DIR="${{ steps.export.outputs.build_directory }}/Linux"
          chmod +x ./scripts/package-appimage.sh
          ./scripts/package-appimage.sh "$BUILD_DIR" release-assets/CardWars-x86_64.AppImage
          tar -czvf release-assets/CardWars-Linux.tar.gz -C "$BUILD_DIR" .

      - name: Package Windows (Zip)
        run: |
          mkdir -p release-assets
          BUILD_DIR="${{ steps.export.outputs.build_directory }}/Windows Desktop"
          cd "$BUILD_DIR"
          zip -r "$GITHUB_WORKSPACE/release-assets/CardWars-Windows.zip" .
          cd "$GITHUB_WORKSPACE"

      - name: Package macOS (Zip)
        run: |
          mkdir -p release-assets
          BUILD_DIR="${{ steps.export.outputs.build_directory }}/macOS"
          if [ -f "$BUILD_DIR/CardWars.zip" ]; then
            cp "$BUILD_DIR/CardWars.zip" release-assets/CardWars-macOS.zip
          else
            cd "$BUILD_DIR"
            zip -r "$GITHUB_WORKSPACE/release-assets/CardWars-macOS.zip" .
            cd "$GITHUB_WORKSPACE"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CardWars-All-Platforms
          path: release-assets/
          if-no-files-found: error

      - name: Determine Release Tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        id: release_info
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Card Wars (Godot 4) ${{ steps.release_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/CardWars-x86_64.AppImage
            release-assets/CardWars-Linux.tar.gz
            release-assets/CardWars-Windows.zip
            release-assets/CardWars-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
